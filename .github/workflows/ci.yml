name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One interpreter, the current one. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Unit tests
        run: pytest -q

      - name: Smoke benchmark, 10k rows x 20 columns
        run: python scripts/bench.py --rows 10k --out-dir bench

      - name: Check the report is self-contained
        run: |
          python - <<'PY'
          import glob, re, sys
          path = sorted(glob.glob("bench/10k-*.html"))[0]
          html = open(path, encoding="utf-8").read()
          bad = re.findall(r'(?:src|href)="(?!#)([^"]+)"', html)
          assert not bad, f"report references external resources: {bad}"
          assert len(html) < 8_000_000, f"report unexpectedly large: {len(html)} bytes"
          print(f"{path}: {len(html)/1024:.0f} KB, no external references")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: report-10k
          path: |
            bench/10k-*.html
            bench/10k-*.json
          retention-days: 14
