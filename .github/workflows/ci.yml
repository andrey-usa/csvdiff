name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        engine: [duckdb]
        include:
          - python: "3.12"
            engine: pandas          # fallback path, DuckDB deliberately not installed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ "${{ matrix.engine }}" = "duckdb" ]; then pip install "duckdb>=1.0"; else pip install "pandas>=2.0"; fi
          pip install -e . --no-deps

      - name: Unit tests
        run: pytest -q

      - name: Smoke benchmark, 10k rows x 20 columns
        run: python scripts/bench.py --rows 10k --engine ${{ matrix.engine }} --out-dir bench

      - name: Check the report is self-contained
        run: |
          python - <<'PY'
          import glob, re, sys
          path = sorted(glob.glob("bench/10k-*.html"))[0]
          html = open(path, encoding="utf-8").read()
          bad = re.findall(r'(?:src|href)="(?!#)([^"]+)"', html)
          assert not bad, f"report references external resources: {bad}"
          assert len(html) < 8_000_000, f"report unexpectedly large: {len(html)} bytes"
          print(f"{path}: {len(html)/1024:.0f} KB, no external references")
          PY

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: report-10k-${{ matrix.engine }}
          path: |
            bench/10k-*.html
            bench/10k-*.json
          retention-days: 14

  engines-agree:
    name: engines produce identical counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install "duckdb>=1.0" "pandas>=2.0"
          pip install -e . --no-deps
      - run: python scripts/gen_data.py --rows 200k --out-dir data
      - name: Compare with both engines and diff the summaries
        run: |
          for e in duckdb pandas; do
            csvdiff compare data/200k_a.csv data/200k_b.csv \
              -k account_id,txn_id -i updated_at --engine $e \
              -o /tmp/$e.html --json /tmp/$e.json || true
          done
          python - <<'PY'
          import json
          a = json.load(open("/tmp/duckdb.json")); b = json.load(open("/tmp/pandas.json"))
          assert a["counts"] == b["counts"], (a["counts"], b["counts"])
          assert a["columns"] == b["columns"], (a["columns"], b["columns"])
          print("engines agree:", a["counts"])
          PY
