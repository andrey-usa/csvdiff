name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test py${{ matrix.python }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        engine: [duckdb]
        include:
          # One job per alternative engine, each with only its own dependency
          # installed, so nothing silently falls back to another engine.
          - python: "3.12"
            engine: polars
          - python: "3.12"
            engine: arrow
          - python: "3.12"
            engine: datafusion
          - python: "3.12"
            engine: pandas
          - python: "3.12"
            engine: python          # standard library only, no engine installed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          case "$ENGINE" in
            duckdb)     pip install "duckdb>=1.0" ;;
            polars)     pip install "polars>=1.0" ;;
            arrow)      pip install "pyarrow>=15.0" ;;
            datafusion) pip install "datafusion>=40.0" ;;
            pandas)     pip install "pandas>=2.0" ;;
            python)     : ;;
          esac
          pip install -e . --no-deps

      - name: Unit tests
        run: pytest -q

      - name: Smoke benchmark, 10k rows x 20 columns
        run: python scripts/bench.py --rows 10k --engine ${{ matrix.engine }} --out-dir bench

      - name: Check the report is self-contained
        run: |
          python - <<'PY'
          import glob, re, sys
          path = sorted(glob.glob("bench/10k-*.html"))[0]
          html = open(path, encoding="utf-8").read()
          bad = re.findall(r'(?:src|href)="(?!#)([^"]+)"', html)
          assert not bad, f"report references external resources: {bad}"
          assert len(html) < 8_000_000, f"report unexpectedly large: {len(html)} bytes"
          print(f"{path}: {len(html)/1024:.0f} KB, no external references")
          PY

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: report-10k-${{ matrix.engine }}
          path: |
            bench/10k-*.html
            bench/10k-*.json
          retention-days: 14

  engines-agree:
    name: engines produce identical counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -e ".[all-engines]"
      - run: python scripts/gen_data.py --rows 200k --out-dir data
      - name: Compare with every engine and diff the summaries
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from csvdiff import engines

          names = engines.available(contract_only=True)
          print("engines:", ", ".join(names))
          assert len(names) > 1, "expected several engines to be installed"
          summaries = {}
          for name in names:
              subprocess.run([sys.executable, "-m", "csvdiff", "compare",
                              "data/200k_a.csv", "data/200k_b.csv",
                              "-k", "account_id,txn_id", "-i", "updated_at",
                              "--engine", name, "-o", f"/tmp/{name}.html",
                              "--json", f"/tmp/{name}.json"], check=False)
              summaries[name] = json.load(open(f"/tmp/{name}.json"))
          reference = summaries["duckdb"]
          for name, got in summaries.items():
              for section in ("counts", "columns"):
                  assert got[section] == reference[section], \
                      f"{name} disagrees with duckdb in {section}: {got[section]}"
          print("all engines agree:", reference["counts"])
          PY
