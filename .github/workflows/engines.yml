name: Engine benchmark

on:
  workflow_dispatch:
    inputs:
      scales:
        description: 'Comma-separated row counts, e.g. "10k,1m" or "10k,1m,10m".'
        type: string
        default: 10k,1m
      engines:
        description: 'Comma-separated engines, or "installed" for every engine on the runner.'
        type: string
        default: installed
      repeat:
        description: Runs per pair; the median is reported
        type: string
        default: "3"
  schedule:
    - cron: "41 5 1 * *"          # first of the month, 05:41 UTC

permissions:
  contents: read

jobs:
  matrix:
    name: every engine, ${{ inputs.scales || '10k,1m' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install every engine
        run: |
          pip install --upgrade pip
          pip install -e ".[bench]"

      - name: Runner capacity
        run: |
          echo "cpus: $(nproc)"; free -g | sed -n '1,2p'; df -h / | tail -1

      - name: Run the matrix
        env:
          SCALES: ${{ inputs.scales || '10k,1m' }}
          ENGINES: ${{ inputs.engines || 'installed' }}
          REPEAT: ${{ inputs.repeat || '3' }}
        run: |
          extra=""
          [ "$ENGINES" != "installed" ] && extra="--engines $ENGINES"
          python scripts/bench_matrix.py \
            --scales "$SCALES" --repeat "$REPEAT" \
            --threads "$(nproc)" --memory-limit 8GB \
            --data-dir data --out-dir bench $extra

      - name: Fail if an engine disagrees with DuckDB
        run: |
          python - <<'PY'
          import json, sys
          matrix = json.load(open("bench/matrix.json"))
          bad = [f"{scale}/{engine}" for scale, engines in matrix.items()
                 for engine, record in engines.items() if record.get("agreement") == "MISMATCH"]
          if bad:
              sys.exit("engines disagree with duckdb: " + ", ".join(bad))
          print("every engine agrees with duckdb")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-matrix
          path: |
            bench/matrix.json
            bench/matrix.md
            bench/**/*.json
          retention-days: 30
