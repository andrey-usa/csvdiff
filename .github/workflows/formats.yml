name: Formats (Rust, Zig, C++)

# The three native ports read CSV, newline-delimited JSON and Parquet, and the
# only claim worth CI time is that they cannot disagree: every port, on every
# format, has to return the same counts and the same per-column stats for the
# same rows. The payloads come from this project's own generator, so a
# disagreement is a reader bug rather than a converter's.

on:
  push:
    # `main` only. Every branch here gets a pull request, and a branch listed
    # beside it means each push runs this workflow twice on the same SHA -- once
    # for the push, once for the pull_request -- which the per-ref concurrency
    # group cannot collapse, because a push is `refs/heads/...` and a pull
    # request is `refs/pull/N/merge`. Two different groups, two full runs. The
    # `pull_request` trigger below covers the branch; this one covers what
    # landed.
    branches: [main]
    paths:
      - "rust/**"
      - "zig/**"
      - "cpp/**"
      - "tests/fixtures/formats/**"
      - "scripts/bench_formats_ports.py"
      - ".github/workflows/formats.yml"
  pull_request:
    paths:
      - "rust/**"
      - "zig/**"
      - "cpp/**"
      - "tests/fixtures/formats/**"
      - "scripts/bench_formats_ports.py"
      - ".github/workflows/formats.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: "How many rows the benchmark uses"
        default: "1m"

concurrency:
  group: formats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agree:
    name: every port reads every format the same way
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Zig comes from PyPI rather than ziglang.org: it is the same release,
      # and it needs no network beyond the one the runner already trusts.
      - name: Install Zig
        run: |
          pip install ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version

      # gen-data as well as the engine: the Zig suite's columnar Parquet checks
      # write their fixtures with `cpp/build/gen-data --format parquet`, and
      # they skip themselves by name rather than failing when it is absent --
      # which is how eleven of them silently did not run here.
      # The three at once; see scripts/build_ports.sh. `rust` there is the
      # --no-default-features build, which is the one this job wants: every run
      # here is `--engine turbo` or the columnar Parquet path.
      - name: Build the three ports
        env:
          CXX: clang++
        run: scripts/build_ports.sh rust zig cpp cpp-gen

      # The dev profile, deliberately: the release profile links with thin LTO
      # in one codegen unit, which costs minutes per test binary and buys
      # nothing a correctness test can use. Same feature set as the build above,
      # so the two share a target directory instead of each filling their own.
      - name: Rust format tests
        run: cd rust && cargo test --no-default-features --test formats --test parquet

      # A skip is not a pass. The suite reports one per line, so the run fails
      # if any check declined to run for want of a tool this job just built.
      - name: Zig test suite, against the Rust port
        run: |
          cd zig
          ZIG=zig ./test.sh | tee /tmp/zig-test.txt
          status=${PIPESTATUS[0]}
          if grep -q "  skip" /tmp/zig-test.txt; then
            echo "::error::a check skipped itself:"
            grep "  skip" /tmp/zig-test.txt
            exit 1
          fi
          exit "$status"

      - name: Every port, every format, one answer
        run: |
          ROWS="${{ github.event.inputs.rows || '1m' }}"
          mkdir -p data
          for f in csv ndjson parquet; do
            ./rust/target/release/gen-data --rows "$ROWS" --out-dir data --prefix fmt --format $f
          done
          run() {  # port, binary, extra flags, format, and optionally an A to use
            ext=$4
            a=${5:-data/fmt_a.$ext}
            $2 compare "$a" data/fmt_b.$ext -k account_id,txn_id -i updated_at \
              $3 --json "/tmp/$1-$ext.json" >/dev/null || true
          }
          for ext in csv ndjson parquet; do
            run cpp ./cpp/build/csvdiff "" $ext
            run rust "./rust/target/release/csvdiff" "--engine turbo -o /dev/null" $ext
            run zig ./zig/zig-out/bin/csvdiff "" $ext
          done
          # One Parquet side against one text side: not the columnar path, which
          # has no column to compare a byte stream against, but the same answer
          # -- so it belongs in the set that has to agree.
          run rust-mixed "./rust/target/release/csvdiff" "--engine turbo -o /dev/null" csv \
            data/fmt_a.parquet
          run zig-mixed ./zig/zig-out/bin/csvdiff "" csv data/fmt_a.parquet
          python3 - <<'PY'
          import glob, json, sys
          answers = {}
          for path in sorted(glob.glob("/tmp/*-*.json")):
              name = path.split("/")[-1][:-5]
              summary = json.load(open(path))
              answers[name] = (summary["counts"],
                               [(c["name"], c["changed"], c["blanked"], c["filled"])
                                for c in summary["columns"]])
          if not answers:
              sys.exit("no run produced a summary")
          reference = next(iter(answers))
          for name, value in answers.items():
              if value != answers[reference]:
                  sys.exit(f"{name} disagrees with {reference}:\n  {value}\n  {answers[reference]}")
          print(f"{len(answers)} runs agree:", json.dumps(answers[reference][0]))
          print("| run | rows | matched | changed | added | removed |")
          print("|---|---:|---:|---:|---:|---:|")
          c = answers[reference][0]
          for name in answers:
              print(f"| {name} | {c['a_rows']} | {c['matched']} | {c['changed']} "
                    f"| {c['added']} | {c['removed']} |")
          PY

      # Wall time, CPU time and peak RSS on every row: what it cost, how many
      # cores it took to cost that, and what it held while doing it.
      - name: Benchmark the three ports across the three formats
        run: |
          python3 scripts/bench_formats_ports.py \
            --rows ${{ github.event.inputs.rows || '1m' }} --repeats 2 \
            | tee /tmp/bench.txt
          {
            echo "## Ports and formats — ${{ github.event.inputs.rows || '1m' }} rows"
            echo
            echo '```'
            cat /tmp/bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
