name: Scale ceiling

# How many rows each port can compare on one GitHub-hosted runner before it
# stops, and how little memory each one needs to finish the same work.
#
# Two questions, and they are not the same one. The first is a ceiling: climb a
# ladder of sizes until something fails, and report what stopped it. The second
# is a floor: fix the size and lower a cgroup limit until the run is killed. A
# port can lead on one and trail on the other, which is why both tables exist.
#
# One build per runner, on purpose. Every job gets its own VM -- its own cores,
# its own memory, its own 14 GB disk -- so four ports on four runners do not
# share the disk that the ladder is trying to fill. A port that dies at 40m
# takes nothing else down with it, which is why the matrix does not fail fast.
#
# The ladder is a step per size rather than one step for all of them. A single
# step is one collapsed block in the UI: you cannot see which sizes passed until
# it ends, and if it ends by being killed you cannot see anything. A step per
# size shows progress as it happens, and the ceiling is the first red tick.
#
# Three runner families, because "runs on GitHub Actions" is a claim about all
# of them:
#
#   ubuntu-latest      x86-64, 4 cores, 16 GB. The reference.
#   ubuntu-24.04-arm   aarch64, same size. The first time this port has run on
#                      ARM at all -- the field scan's SWAR fallback is the path
#                      taken there, and it has only ever been checked by
#                      undefining the SIMD macros on an x86 host.
#   windows-latest     Rust only. It is the one port that builds there; the
#                      other three need POSIX headers MSVC does not have.
#
# Peak RSS is reported and is not the memory answer. An engine that maps its
# input has reclaimable pages, so RSS is whatever the kernel allowed rather than
# what was needed. The floor job answers that, by taking memory away until the
# run dies -- which needs cgroups, so it is Linux only.

on:
  workflow_dispatch:
    inputs:
      floor_size:
        description: "Size the memory floor is searched at"
        default: "10m"
      floor_hi:
        description: "Memory-floor search: a limit in MB expected to pass"
        default: "8192"
      repeats:
        description: "Runs per size; the best is kept"
        default: "1"

concurrency:
  group: scale-ceiling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ceiling:
    name: "${{ matrix.port }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     port: c }
          - { os: ubuntu-latest,     port: cpp }
          - { os: ubuntu-latest,     port: rust }
          - { os: ubuntu-latest,     port: zig }
          - { os: ubuntu-24.04-arm,  port: c }
          - { os: ubuntu-24.04-arm,  port: cpp }
          - { os: ubuntu-24.04-arm,  port: rust }
          - { os: ubuntu-24.04-arm,  port: zig }
          - { os: windows-latest,    port: rust }
    defaults:
      run:
        shell: bash          # Git Bash on the Windows runner, so one script serves all three
    steps:
      - uses: actions/checkout@v4

      # 60m rows of CSV is 22 GB for one pair and the runner advertises 14 GB,
      # so the preinstalled toolchains this job never touches have to go first.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          before=$(df --output=avail -m / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          after=$(df --output=avail -m / | tail -1)
          echo "freed $(( (after - before) / 1024 )) GB, $(( after / 1024 )) GB now available"

      - name: What this runner is
        run: |
          {
            echo "### ${{ matrix.port }} on ${{ matrix.os }}"
            echo
            echo '```'
            uname -m
            if [ -r /proc/cpuinfo ]; then
              grep -m1 -E "model name|Model" /proc/cpuinfo || true
              grep -o -m1 -E "avx2|avx512f|asimd|neon" /proc/cpuinfo | sort -u | tr '\n' ' '; echo
            fi
            df -h . | tail -1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.port == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.port == 'rust'
        with:
          workspaces: rust

      - name: Install Zig
        if: matrix.port == 'zig'
        run: |
          pip install ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version

      - name: Build
        run: |
          case "${{ matrix.port }}" in
            c)    make -C c && make -C c gen-data ;;
            cpp)  make -C cpp && make -C c gen-data ;;
            zig)  (cd zig && zig build --release=fast) && make -C c gen-data ;;
            rust) cargo build --release --manifest-path rust/Cargo.toml ;;
          esac

      # The binary, the generator, and where the pairs go. The C generator is
      # the fastest and every generator writes byte-identical files, so it is
      # used wherever it builds; on Windows it does not, and the Rust one does.
      - name: Resolve paths
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          case "${{ matrix.port }}" in
            c)    BIN="c/csvdiff" ;;
            cpp)  BIN="cpp/build/csvdiff" ;;
            rust) BIN="rust/target/release/csvdiff$EXE" ;;
            zig)  BIN="zig/zig-out/bin/csvdiff$EXE" ;;
          esac
          if [ "$RUNNER_OS" = "Windows" ]; then
            GEN="rust/target/release/gen-data$EXE"
          else
            GEN="c/gen-data"
          fi
          {
            echo "LADDER_BIN=$BIN"
            echo "LADDER_GEN=$GEN"
            echo "LADDER_PORT=${{ matrix.port }}"
            echo "LADDER_RUNNER=${{ matrix.os }}"
            echo "LADDER_REPEATS=${{ inputs.repeats }}"
            echo "LADDER_THREADS=$(nproc 2>/dev/null || echo 4)"
            echo "LADDER_DATA=${RUNNER_TEMP}/scale"
          } >> "$GITHUB_ENV"
          ls -l "$BIN" "$GEN"

      # One step per rung. A red tick here is the ceiling, and it stops the
      # rest -- which is the ladder ending rather than something to fix.
      - name: "10m rows"
        run: bash scripts/ladder_step.sh 10m
      - name: "20m rows"
        run: bash scripts/ladder_step.sh 20m
      - name: "30m rows"
        run: bash scripts/ladder_step.sh 30m
      - name: "40m rows"
        run: bash scripts/ladder_step.sh 40m
      - name: "50m rows"
        run: bash scripts/ladder_step.sh 50m
      - name: "60m rows"
        run: bash scripts/ladder_step.sh 60m

      - name: Where it stopped
        if: always()
        run: |
          {
            echo "<details><summary>${{ matrix.port }} on ${{ matrix.os }} — rungs recorded</summary>"
            echo
            echo '```'
            ls -1 out/ 2>/dev/null || echo "(none)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceiling-${{ matrix.port }}-${{ matrix.os }}
          path: out/

  floor:
    name: "floor: ${{ matrix.port }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Linux only: taking memory away needs a cgroup, and Windows has none.
        include:
          - { os: ubuntu-latest,    port: c }
          - { os: ubuntu-latest,    port: cpp }
          - { os: ubuntu-latest,    port: rust }
          - { os: ubuntu-latest,    port: zig }
          - { os: ubuntu-24.04-arm, port: c }
          - { os: ubuntu-24.04-arm, port: cpp }
          - { os: ubuntu-24.04-arm, port: rust }
          - { os: ubuntu-24.04-arm, port: zig }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.port == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.port == 'rust'
        with:
          workspaces: rust

      - name: Install Zig
        if: matrix.port == 'zig'
        run: |
          pip install ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig

      - name: Build
        run: |
          make -C c gen-data
          case "${{ matrix.port }}" in
            c)    make -C c ;;
            cpp)  make -C cpp ;;
            rust) cargo build --release --manifest-path rust/Cargo.toml ;;
            zig)  (cd zig && zig build --release=fast) ;;
          esac

      - name: Take the memory away
        run: |
          case "${{ matrix.port }}" in
            c)    BIN=c/csvdiff ;;
            cpp)  BIN=cpp/build/csvdiff ;;
            rust) BIN=rust/target/release/csvdiff ;;
            zig)  BIN=zig/zig-out/bin/csvdiff ;;
          esac
          D="$RUNNER_TEMP/floor"; mkdir -p "$D" out
          c/gen-data --rows "${{ inputs.floor_size }}" --out-dir "$D" --prefix f
          sudo -E env \
              CSVDIFF_FLOOR_HI="${{ inputs.floor_hi }}" \
              CSVDIFF_FLOOR_LO=32 \
              CSVDIFF_FLOOR_JSON="$RUNNER_TEMP/floor-raw.json" \
              scripts/memory_floor.sh "$PWD/$BIN" compare \
                  "$D/f_a.csv" "$D/f_b.csv" -k account_id,txn_id -i updated_at \
              2>&1 | tee "out/floor-${{ matrix.port }}-${{ matrix.os }}.txt"
          python3 scripts/floor_record.py \
              --raw "$RUNNER_TEMP/floor-raw.json" \
              --port "${{ matrix.port }}" \
              --runner "${{ matrix.os }}" \
              --size "${{ inputs.floor_size }}" \
              --out "out/floor-${{ matrix.port }}-${{ matrix.os }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-${{ matrix.port }}-${{ matrix.os }}
          path: out/

  collect:
    name: the two tables
    needs: [ceiling, floor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Merge
        run: |
          python3 scripts/scale_report.py \
              --ceiling results/ceiling-*/ceiling-*.json \
              --floor results/floor-*/floor-*.json \
              --title "Scale ceiling — floor searched at ${{ inputs.floor_size }}" \
              --out scale-report.md
          cat scale-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: scale-report
          path: scale-report.md
