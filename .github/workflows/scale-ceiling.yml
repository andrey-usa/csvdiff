name: Scale ceiling

# How many rows each port can compare on one GitHub-hosted runner before it
# stops, and how little memory each one needs to finish the same work.
#
# Two questions, and they are not the same question. The first is a ceiling:
# walk a ladder of sizes until something fails, and report what stopped it. The
# second is a floor: fix the size and lower a cgroup limit until the run is
# killed. A port can lead on one and trail on the other, which is the reason
# both tables are here rather than one.
#
# One runner per rung: every (port, size) pair is its own job. The first version
# of this file put one port on a runner and had it climb the whole ladder, which
# made the ladder -- the thing this workflow is named after -- entirely
# sequential. Four jobs ran at once and each of them did six sizes back to back,
# so the run took as long as the tallest ladder and no size reported until the
# ones below it had finished. Splitting the ladder into steps, which this file
# also tried, does not change that: steps inside a job are sequential by
# definition. Only separate jobs run at the same time.
#
# The disk argument that produced the old shape still holds and is better served
# here: sixty million rows of CSV is 22 GB of input for one pair, and one rung
# on its own runner has that runner's whole disk rather than sharing it with the
# five rungs before it.
#
# There is a second reason, and it is about the answer rather than the clock.
# Climbing in order means stopping at the first failure, so a rung that dies for
# a passing reason hides every rung above it and the ceiling reads lower than it
# is. Independent rungs measure every size, and the report already takes the
# largest one that passed rather than the last one before a failure.
#
# The cost is runner slots: four ports by six sizes is 24 jobs, plus four for
# the floor, against a limit of 20 concurrent jobs on the Free plan. The excess
# queues and drains. This repository is public, so standard runners cost no
# minutes -- the only price is that the last wave starts late.
#
# Peak RSS is reported but is not the memory answer. An engine that maps its
# input has reclaimable pages, so its RSS is whatever the kernel let it keep
# rather than what it needed. The floor job is the one that answers that, by
# taking the memory away until the run dies.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Ladder: one job per size, all at once (comma separated)"
        default: "10m,20m,30m,40m,50m,60m"
      floor_size:
        description: "Size the memory floor is searched at"
        default: "10m"
      floor_hi:
        description: "Memory-floor search: a limit in MB expected to pass"
        default: "8192"
      repeats:
        description: "Runs per size; the best is kept"
        default: "1"

# The repository's rule is one benchmark at a time: two timing jobs on one host
# measure each other's contention. These are separate hosted runners so they do
# not contend with each other, but they should still not overlap another run of
# themselves.
concurrency:
  group: scale-ceiling
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A matrix cannot be built from a comma-separated string, and the ladder is an
  # input rather than a constant, so one small job turns "10m,20m" into ["10m",
  # "20m"] for the matrix below to fan out over.
  plan:
    name: the ladder
    runs-on: ubuntu-latest
    outputs:
      sizes: ${{ steps.split.outputs.sizes }}
    steps:
      - id: split
        env:
          SIZES: ${{ inputs.sizes }}
        run: |
          python3 -c "import json,os;print('sizes='+json.dumps([s.strip() for s in os.environ['SIZES'].split(',') if s.strip()]))" \
              | tee -a "$GITHUB_OUTPUT"

  ceiling:
    name: "ceiling: ${{ matrix.port }} at ${{ matrix.size }}"
    needs: plan
    runs-on: ubuntu-latest
    # One rung, not six. The old number was 330 because it covered a whole
    # ladder; a single size that needs three hours is a result worth having, and
    # anything past that is the runner rather than the port.
    timeout-minutes: 180
    strategy:
      fail-fast: false          # a rung that dies is a result, not a reason to stop
      matrix:
        port: [c, cpp, rust, zig]
        size: ${{ fromJSON(needs.plan.outputs.sizes) }}
    steps:
      - uses: actions/checkout@v4

      # The ladder needs every gigabyte: 60m rows of CSV is 22 GB for one pair,
      # and the runner ships with about 25 GB of toolchains this job never uses.
      - name: Free disk space
        run: |
          before=$(df --output=avail -m / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          after=$(df --output=avail -m / | tail -1)
          echo "freed $(( (after - before) / 1024 )) GB, $(( after / 1024 )) GB now available"

      - name: What this runner is
        run: |
          {
            echo "### ${{ matrix.port }} at ${{ matrix.size }}"
            echo
            echo '```'
            grep -m1 "model name" /proc/cpuinfo
            echo "cores: $(nproc)"
            free -g | head -2
            df -h / | tail -1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.port == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.port == 'rust'
        with:
          workspaces: rust

      - name: Install Zig
        if: matrix.port == 'zig'
        run: |
          pip install ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version

      # The C generator regardless of which port is measured: every generator
      # emits byte-identical files, and this one is the fastest and needs only a
      # compiler.
      - name: Build
        run: |
          make -C c gen-data
          case "${{ matrix.port }}" in
            c)    make -C c ;;
            cpp)  CXX=clang++ make -C cpp ;;
            rust) cargo build --release --manifest-path rust/Cargo.toml ;;
            zig)  (cd zig && zig build --release=fast) ;;
          esac

      - name: This rung
        run: |
          case "${{ matrix.port }}" in
            c)    BIN=c/csvdiff ;;
            cpp)  BIN=cpp/build/csvdiff ;;
            rust) BIN=rust/target/release/csvdiff ;;
            zig)  BIN=zig/zig-out/bin/csvdiff ;;
          esac
          mkdir -p out
          # One size. No --stop-on-fail: there is nothing after this to stop.
          python3 scripts/bench_scale.py \
              --binary "$BIN" --label "${{ matrix.port }}" \
              --sizes "${{ matrix.size }}" \
              --repeats "${{ inputs.repeats }}" \
              --threads "$(nproc)" \
              --data-dir "$RUNNER_TEMP/scale" \
              --json-out "out/ceiling-${{ matrix.port }}-${{ matrix.size }}.json" \
              2>&1 | tee "out/ceiling-${{ matrix.port }}-${{ matrix.size }}.txt"

      - name: This rung, in the summary
        if: always()
        run: |
          {
            echo "<details><summary>${{ matrix.port }} at ${{ matrix.size }}</summary>"
            echo
            echo '```'
            cat "out/ceiling-${{ matrix.port }}-${{ matrix.size }}.txt" 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceiling-${{ matrix.port }}-${{ matrix.size }}
          path: out/

  floor:
    name: "floor: ${{ matrix.port }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        port: [c, cpp, rust, zig]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.port == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.port == 'rust'
        with:
          workspaces: rust

      - name: Install Zig
        if: matrix.port == 'zig'
        run: |
          pip install ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig

      - name: Build
        run: |
          make -C c gen-data
          case "${{ matrix.port }}" in
            c)    make -C c ;;
            cpp)  CXX=clang++ make -C cpp ;;
            rust) cargo build --release --manifest-path rust/Cargo.toml ;;
            zig)  (cd zig && zig build --release=fast) ;;
          esac

      - name: Take the memory away
        run: |
          case "${{ matrix.port }}" in
            c)    BIN=c/csvdiff ;;
            cpp)  BIN=cpp/build/csvdiff ;;
            rust) BIN=rust/target/release/csvdiff ;;
            zig)  BIN=zig/zig-out/bin/csvdiff ;;
          esac
          D="$RUNNER_TEMP/floor"; mkdir -p "$D" out
          c/gen-data --rows "${{ inputs.floor_size }}" --out-dir "$D" --prefix f
          # sudo, because writing a cgroup limit needs root; -E to keep the
          # search bounds and the JSON destination.
          sudo -E env \
              CSVDIFF_FLOOR_HI="${{ inputs.floor_hi }}" \
              CSVDIFF_FLOOR_LO=32 \
              CSVDIFF_FLOOR_JSON="$RUNNER_TEMP/floor-raw-${{ matrix.port }}.json" \
              scripts/memory_floor.sh "$PWD/$BIN" compare \
                  "$D/f_a.csv" "$D/f_b.csv" -k account_id,txn_id -i updated_at \
              2>&1 | tee "out/floor-${{ matrix.port }}.txt"
          # The raw file knows the limit; the port and the size are this job's.
          python3 scripts/floor_record.py \
              --raw "$RUNNER_TEMP/floor-raw-${{ matrix.port }}.json" \
              --port "${{ matrix.port }}" \
              --size "${{ inputs.floor_size }}" \
              --out "out/floor-${{ matrix.port }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-${{ matrix.port }}
          path: out/

  collect:
    name: the two tables
    needs: [plan, ceiling, floor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Merge
        run: |
          python3 scripts/scale_report.py \
              --ceiling results/ceiling-*/ceiling-*.json \
              --floor results/floor-*/floor-*.json \
              --title "Scale ceiling — ${{ inputs.sizes }}, floor at ${{ inputs.floor_size }}" \
              --out scale-report.md
          cat scale-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: scale-report
          path: scale-report.md
