name: Benchmark 10M

# Ten million rows, every native port, every scanner, with peak RSS and CPU time
# on every row.
#
# CPU divided by wall is the `cores` column, and it is the one that says *why* a
# row is where it is: two ports at the same wall time, one at 1.4x cores and one
# at 3.6x, are not the same result. The first has headroom the second has
# already spent, and on a four-core runner it is the difference between an
# engine that is slow and an engine that is idle.
#
# It runs here rather than on a laptop for the reason every table in the README
# gives: a comparison between builds only means something when they ran on one
# host in one sitting, and a hosted runner is the one host anyone reading this
# can reproduce. The runner's own vector units are printed into the summary,
# because "SWAR beat AVX-512" means nothing without knowing whether the machine
# had AVX-512 to lose with.
#
# Parquet is written uncompressed: this is a question about readers, and a codec
# in the middle would be answering a different one.
#
# The scanner builds are asked about both formats, because there are two
# scanners. On CSV the idiom finds a delimiter in the mapped file; on a Parquet
# pair, where there are no delimiters at all, the same idiom reads the mismatch
# mask the columnar comparison produces. The two have different hit rates and
# different amounts of memory traffic, so they can and do disagree about which
# width wins -- which is the whole reason both are in the table.

on:
  # A push that touches an engine or the harness re-runs the whole matrix. That
  # is deliberate: a performance change is not a change until it has been
  # measured, and measuring it anywhere but one known host is how the numbers in
  # this repository stop being comparable.
  push:
    branches: ["claude/**", "bench/**"]
    paths:
      - "cpp/src/**"
      - "cpp/Makefile"
      - "rust/src/**"
      - "zig/src/**"
      - "zig/build.zig"
      - "scripts/bench_formats_ports.py"
      - ".github/workflows/bench-10m.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: "Row count (10m, 20m, 1m ...)"
        default: "10m"
      formats:
        description: "Comma-separated: csv, ndjson, parquet"
        default: "csv,parquet"
      repeats:
        description: "Runs per build; the best is kept"
        default: "2"
      matrix:
        description: "Include the scanner builds (SWAR against AVX2 and AVX-512)"
        type: boolean
        default: true
      rust_simd:
        description: "Also build the Rust vector binary (adds ~25 minutes: RUSTFLAGS invalidates the cargo cache)"
        type: boolean
        default: false

concurrency:
  group: bench-10m-${{ github.ref }}
  cancel-in-progress: false

# A push carries no inputs, so the defaults live here and both events read them.
env:
  ROWS: ${{ github.event.inputs.rows || '10m' }}
  FORMATS: ${{ github.event.inputs.formats || 'csv,parquet' }}
  REPEATS: ${{ github.event.inputs.repeats || '2' }}
  MATRIX: ${{ github.event.inputs.matrix || 'true' }}
  RUST_SIMD: ${{ github.event.inputs.rust_simd || 'false' }}

jobs:
  bench:
    name: ten million rows, every port, every scanner
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # Ten million rows of CSV is 3.5 GB and of JSON 8.5 GB, and the runner
      # ships with about 25 GB of toolchains this job never touches.
      - name: Free disk space
        run: |
          before=$(df --output=avail -m / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          after=$(df --output=avail -m / | tail -1)
          echo "freed $(( (after - before) / 1024 )) GB, $(( after / 1024 )) GB now available"

      - name: What this runner is
        run: |
          {
            echo "## Host"
            echo
            echo '```'
            grep -m1 "model name" /proc/cpuinfo
            echo "cores: $(nproc)"
            free -g | head -2
            echo -n "vector units: "
            grep -o -m1 -E "avx2|avx512f|avx512bw" /proc/cpuinfo | sort -u | tr '\n' ' '
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Zig
        run: |
          pip install ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version

      - name: Build every port and every scanner
        run: |
          (cd rust && cargo build --release)
          (cd zig && zig build --release=fast)
          (cd cpp && CXX=clang++ make && CXX=clang++ make gen-data)
          if [ "$MATRIX" = "true" ]; then
            (cd cpp && CXX=clang++ make scanners)
            # -Dcpu=native is not optional here: without it the target is
            # baseline x86-64, @Vector(32, u8) is lowered to scalar code, and
            # the row would be measuring a slower SWAR rather than AVX2.
            (cd zig && zig build --release=fast -Dscan=32 -Dcpu=native --prefix zig-out-v32)
            # Rust's vector path is a target feature rather than a source
            # switch, and changing RUSTFLAGS invalidates everything cargo has
            # cached -- a second full build of DuckDB and Polars for one scanner.
            # Worth twenty-five minutes when the question is being asked, and off
            # by default when it is not.
            if [ "$RUST_SIMD" = "true" ]; then
              (cd rust && RUSTFLAGS="-C target-feature=+avx2" \
                  cargo build --release --target-dir target-avx2)
            fi
            if grep -q avx512bw /proc/cpuinfo; then
              (cd zig && zig build --release=fast -Dscan=64 -Dcpu=native --prefix zig-out-v64)
            else
              echo "no AVX-512 on this runner: the 64-byte builds are skipped"
              rm -f cpp/build/csvdiff-avx512
            fi
          fi

      - name: Run the matrix
        run: |
          matrix=""
          [ "$MATRIX" = "true" ] && matrix="--matrix"
          python3 scripts/bench_formats_ports.py \
            --rows "$ROWS" --formats "$FORMATS" --repeats "$REPEATS" $matrix \
            | tee /tmp/bench.txt

      - name: Publish the table
        if: always()
        run: |
          {
            echo "## $ROWS rows — $FORMATS"
            echo
            echo '```'
            cat /tmp/bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.run_id }}
          path: /tmp/bench.txt
          retention-days: 30
