name: Cross-language parity

# One dataset, every native port, the same answer.
#
# This used to build five implementations -- Python, Java, TypeScript, Go and
# Rust -- and spent most of its wall clock installing toolchains for engines the
# project no longer competes on. It now asks the narrower question that is still
# capable of failing: do the byte-level ports agree, on a file none of them
# generated for themselves?
#
# The dataset comes from c/gen-data, which is the cheapest generator to build
# here and writes the same bytes as every other one -- which c/test.sh
# --with-ports checks, so this job does not have to.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "c/**"
      - "cpp/**"
      - "rust/src/**"
      - "zig/src/**"
      - ".github/workflows/parity.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: one dataset, every native port
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Zig
        run: |
          curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build the native ports
        run: |
          make -C c
          make -C cpp
          cargo build --release --manifest-path rust/Cargo.toml
          (cd zig && zig build --release=fast)

      - name: One dataset, from the C generator
        run: |
          mkdir -p data
          c/gen-data --rows 200k --out-dir data --prefix p
          c/gen-data --rows 200k --out-dir data --prefix p --format json
          c/gen-data --rows 200k --out-dir data --prefix p --format parquet

      # Each port is asked for every format it reads. A port that refuses a
      # format is skipped by name rather than counted as agreeing with everyone.
      - name: Every port, every format it reads
        run: |
          set -u
          KEY="-k account_id,txn_id -i updated_at"
          run() { # name, format, then the argv
            local name=$1 fmt=$2; shift 2
            if "$@" $KEY --json "/tmp/$name.$fmt.json" >/dev/null 2>&1 || [ $? -le 1 ]; then :; fi
            [ -s "/tmp/$name.$fmt.json" ] || rm -f "/tmp/$name.$fmt.json"
          }
          for fmt in csv ndjson unc.parquet; do
            a="data/p_a.$fmt"; b="data/p_b.$fmt"
            run c    "$fmt" c/csvdiff compare "$a" "$b"
            run cpp  "$fmt" cpp/build/csvdiff compare "$a" "$b"
            run rust "$fmt" rust/target/release/csvdiff compare "$a" "$b" --engine turbo -o /dev/null
            run zig  "$fmt" zig/zig-out/bin/csvdiff compare "$a" "$b"
          done
          python3 - <<'PY'
          import glob, json, sys, collections
          by_fmt = collections.defaultdict(dict)
          for path in sorted(glob.glob("/tmp/*.json")):
              name = path.split("/")[-1]
              port, fmt = name.split(".", 1)
              by_fmt[fmt[:-5]][port] = json.load(open(path))
          bad = 0
          for fmt, ports in sorted(by_fmt.items()):
              if len(ports) < 2:
                  print(f"{fmt}: only {list(ports)} read it")
                  continue
              ref_name, ref = sorted(ports.items())[0]
              for port, got in sorted(ports.items()):
                  for section in ("counts", "columns"):
                      if got.get(section) != ref.get(section):
                          print(f"::error::{fmt}: {port} {section} differ from {ref_name}")
                          bad = 1
              print(f"{fmt}: {len(ports)} ports agree -- {', '.join(sorted(ports))}")
          sys.exit(bad)
          PY
