name: CI (Rust)

# `claude/**` as well as main, like ci-c.yml and parity.yml: a Rust change on a
# feature branch had no Rust gate at all until this line, which is how a commit
# that deleted two engines and rewrote the Engine enum reached the remote with
# only a local `cargo test` behind it.
on:
  push:
    # `main` only. Every branch here gets a pull request, and a branch listed
    # beside it means each push runs this workflow twice on the same SHA -- once
    # for the push, once for the pull_request -- which the per-ref concurrency
    # group cannot collapse, because a push is `refs/heads/...` and a pull
    # request is `refs/pull/N/merge`. Two different groups, two full runs. The
    # `pull_request` trigger below covers the branch; this one covers what
    # landed.
    branches: [main]
    paths: ["rust/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/ci-rust.yml"]
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: test rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # A cold build is about twenty seconds now that the dataframe engines are
      # gone; the cache keeps it under that.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo --version && rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Smoke benchmark, 10k rows x 20 columns
        run: ./target/release/bench --rows 10k --engine turbo --out-dir bench

      - name: Check the report is self-contained
        run: |
          python3 - <<'PY'
          import glob, re, sys
          path = glob.glob("bench/10k-*.html")[0]
          html = open(path, encoding="utf-8").read()
          external = re.search(r'(?:src|href)="(?!#)([^"]+)"', html)
          if external:
              sys.exit(f"report references external resources: {external.group(1)}")
          if len(html) >= 8_000_000:
              sys.exit(f"report unexpectedly large: {len(html)}")
          print(f"{path}: {len(html) // 1024} KB, no external references")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: report-rust-10k
          path: |
            rust/bench/10k-*.html
            rust/bench/10k-*.json
          retention-days: 14

  engines-agree:
    name: all engines produce identical counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release
      - run: ./target/release/gen-data --rows 200k --out-dir data
      # Every engine this port still carries, which is every engine it has:
      # the dataframe ones are gone, and their numbers are in ARCHIVE.md.
      - name: Compare with every engine and diff the summaries
        run: |
          for e in turbo native; do
            ./target/release/csvdiff compare data/200k_a.csv data/200k_b.csv \
              -k account_id,txn_id -i updated_at --engine $e \
              -o /tmp/$e.html --json /tmp/$e.json || true
          done
          python3 - <<'PY'
          import json, sys
          engines = ["turbo", "native"]
          ref = ref_name = None
          for e in engines:
              n = json.load(open(f"/tmp/{e}.json"))
              if ref is None:
                  ref, ref_name = n, e
                  continue
              for section in ("counts", "columns"):
                  if n[section] != ref[section]:
                      sys.exit(f"{e} {section} differ from {ref_name}: {n[section]} vs {ref[section]}")
          print(f"all {len(engines)} engines agree:", json.dumps(ref["counts"]))
          PY

  windows:
    name: build rust on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Build and test, not just `cargo check`: the point is to catch what a
      # Linux job cannot see. `memmap2::Advice` is gated `#[cfg(unix)]` inside
      # that crate, so this port did not compile on Windows at all -- and the
      # README claimed it did, on the strength of a grep for `std::os::unix`
      # that could not see inside a dependency. A claim about a platform is
      # worth what the runner that proves it is worth.
      - name: Build and test
        run: |
          cargo build --release
          cargo test --release
      # The Rust port is the only one that builds on Windows without WSL: the
      # other three want mmap and pthreads, and Zig wants Linux specifically.
      # So this is the whole of the repository's native Windows coverage.
      - name: Compare two files end to end
        shell: bash
        run: |
          printf 'id,a\nk1,p\nk2,q\n'       > a.csv
          printf 'id,a\nk1,p\nk2,CHANGED\n' > b.csv
          # A compare exits 1 when it finds differences, and this shell runs
          # with -e, so the status has to be caught rather than allowed to end
          # the step. The same trap is documented at the top of c/test.sh.
          code=0
          # --no-compress so the assertion below can read it: the report gzips
          # its payload by default and the browser inflates it.
          ./target/release/csvdiff.exe compare a.csv b.csv -k id \
              --engine turbo -o report.html --no-compress || code=$?
          [ "$code" = 1 ] || { echo "::error::expected exit 1 (differences found), got $code"; exit 1; }
          grep -q "CHANGED" report.html || { echo "::error::the report does not name the changed value"; exit 1; }
      # The README hands a Windows reader these three commands, in this order,
      # and says to run them from the repository root. Both halves have already
      # been wrong once: the examples named two files nothing produces, and then
      # the paths were written from `rust\` while the bash ones were written from
      # the root, so a reader in the wrong directory got `No such file`. This
      # step runs them as written, from the root -- note `working-directory`
      # overriding the workflow default -- so neither can drift again.
      - name: Run the README's Windows commands, from the repository root
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          # A compare exits 1 by design, and two things in GitHub's pwsh would
          # turn that into a failed step: from PowerShell 7.4 a native command's
          # non-zero exit throws under `$ErrorActionPreference = 'stop'`, which
          # the wrapper sets; and the wrapper appends `exit $LASTEXITCODE`. So
          # opt out of the first and end with an explicit `exit 0`.
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --release --manifest-path rust\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "the README's build line exited $LASTEXITCODE" }
          rust\target\release\gen-data.exe --rows 10k --out-dir data --prefix demo
          if ($LASTEXITCODE -ne 0) { throw "gen-data exited $LASTEXITCODE" }
          rust\target\release\csvdiff.exe compare data\demo_a.csv data\demo_b.csv `
              -k account_id,txn_id -i updated_at
          if ($LASTEXITCODE -ne 1) { throw "expected exit 1 (differences found), got $LASTEXITCODE" }
          exit 0
