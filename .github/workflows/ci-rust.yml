name: CI (Rust)

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/ci-rust.yml"]
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  test:
    name: test rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # DuckDB is compiled from its bundled amalgamation, so a cold build is
      # several minutes; the cache is what keeps this job reasonable.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo --version && rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Smoke benchmark, 10k rows x 20 columns
        run: ./target/release/bench --rows 10k --engine duckdb --out-dir bench

      - name: Check the report is self-contained
        run: |
          python3 - <<'PY'
          import glob, re, sys
          path = glob.glob("bench/10k-*.html")[0]
          html = open(path, encoding="utf-8").read()
          external = re.search(r'(?:src|href)="(?!#)([^"]+)"', html)
          if external:
              sys.exit(f"report references external resources: {external.group(1)}")
          if len(html) >= 8_000_000:
              sys.exit(f"report unexpectedly large: {len(html)}")
          print(f"{path}: {len(html) // 1024} KB, no external references")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: report-rust-10k
          path: |
            rust/bench/10k-*.html
            rust/bench/10k-*.json
          retention-days: 14

  engines-agree:
    name: all engines produce identical counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release
      - run: ./target/release/gen-data --rows 200k --out-dir data
      - name: Compare with every engine and diff the summaries
        run: |
          for e in duckdb polars native; do
            ./target/release/csvdiff compare data/200k_a.csv data/200k_b.csv \
              -k account_id,txn_id -i updated_at --engine $e \
              -o /tmp/$e.html --json /tmp/$e.json || true
          done
          python3 - <<'PY'
          import json, sys
          engines = ["duckdb", "polars", "native"]
          ref = ref_name = None
          for e in engines:
              n = json.load(open(f"/tmp/{e}.json"))
              if ref is None:
                  ref, ref_name = n, e
                  continue
              for section in ("counts", "columns"):
                  if n[section] != ref[section]:
                      sys.exit(f"{e} {section} differ from {ref_name}: {n[section]} vs {ref[section]}")
          print(f"all {len(engines)} engines agree:", json.dumps(ref["counts"]))
          PY
