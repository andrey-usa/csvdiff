name: Benchmark formats

# One comparison, four input formats, nothing but this project involved: the
# generator writes CSV, newline-delimited JSON and Parquet from one recipe, and
# the engine reads all four natively. No third-party reader, no conversion step
# and no intermediate CSV -- so what this measures is the formats and the engine
# rather than whichever third-party reader happened to be installed.
#
# The four counts have to agree. Four readers that disagree about how many rows
# changed is a bug, so the run fails and names the format that disagreed.

on:
  workflow_dispatch:
    inputs:
      scales:
        description: 'Comma-separated row counts, e.g. "100k,10m". "all" means 100k,10m.'
        type: string
        default: all
  schedule:
    - cron: "41 5 * * 1"        # Mondays, 05:41 UTC
  push:
    paths:
      - "cpp/**"
      - "scripts/bench_formats_native.py"
      - ".github/workflows/benchmark-formats.yml"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scales: ${{ steps.pick.outputs.scales }}
    steps:
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - id: pick
        run: |
          raw='${{ inputs.scales || 'all' }}'
          [ "$raw" = "all" ] && raw="100k,10m"
          echo "scales=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split(',')))" "$raw")" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.scale }} rows, four formats
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scale: ${{ fromJSON(needs.plan.outputs.scales) }}
    steps:
      - uses: actions/checkout@v4
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the engine and the generator
        run: |
          cd cpp
          make
          make gen-data
          g++ --version | head -1

      - name: Runner capacity
        run: |
          echo "cpus: $(nproc)"
          free -g | sed -n '1,2p'
          df -h / /mnt 2>/dev/null | sed -n '1,4p'

      # Ten million rows is about 15 GB across all four formats at once, which
      # is more than the runner has, so each is generated, measured and deleted
      # in turn. /mnt is the roomy volume on a GitHub runner.
      - name: Working directory
        id: work
        run: |
          base=/mnt/bench
          sudo mkdir -p "$base" && sudo chown "$USER" "$base" || base="$RUNNER_TEMP/bench"
          mkdir -p "$base"
          echo "dir=$base" >> "$GITHUB_OUTPUT"
          df -h "$base" | tail -1

      - name: Generate and compare, ${{ matrix.scale }} rows
        run: |
          python3 scripts/bench_formats_native.py \
            --rows ${{ matrix.scale }} \
            --data "${{ steps.work.outputs.dir }}" \
            --out "formats-${{ matrix.scale }}.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: formats-${{ matrix.scale }}
          path: formats-*.json
          retention-days: 30

  summarise:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: formats-*
          merge-multiple: true
      - name: Combined results
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json

          def rows_of(scale):
              n = scale.lower().rstrip("kmg")
              mult = {"k": 1_000, "m": 1_000_000, "g": 1_000_000_000}.get(scale.lower()[-1], 1)
              return float(n) * mult

          runs = [json.load(open(p)) for p in sorted(glob.glob("all/*.json"))]
          runs.sort(key=lambda r: rows_of(r["rows"]))
          if not runs:
              print("## Format benchmark\n\nNo results were produced.")
              raise SystemExit(0)

          print("## One comparison, four native formats\n")
          print("Generated and compared by this project alone: the generator writes all four")
          print("from one recipe, and the engine reads all four without a library in between.\n")
          for run in runs:
              base = run["results"][0]["counts"]
              print(f"### {run['rows']} rows x 20 columns, {run['cpus']} cpus\n")
              print("| Input | Size | Generate | **Compare** | Rows/s | CPU | Peak RSS |")
              print("|---|---:|---:|---:|---:|---:|---:|")
              for r in run["results"]:
                  print(f"| {r['format']} | {r['size_mb']:,.0f} MB | {r['generate_seconds']}s "
                        f"| **{r['compare_seconds']}s** | {r['rows_per_second']:,}/s "
                        f"| {r['cpu_seconds']}s | {r['peak_rss_mb']:,} MB |")
              bad = [r["format"] for r in run["results"] if r["counts"] != base]
              if bad:
                  print(f"\n**Disagreed with {run['results'][0]['format']}: {', '.join(bad)}.**\n")
              else:
                  print(f"\nAll {len(run['results'])} agree: matched {base['matched']:,}, "
                        f"changed {base['changed']:,}, added {base['added']:,}, "
                        f"removed {base['removed']:,}.\n")
          PY
