name: Benchmark (TypeScript)

on:
  workflow_dispatch:
    inputs:
      scales:
        description: 'Comma-separated row counts to run, e.g. "10k,1m,10m" or "20m". "all" means 10k,1m,10m.'
        type: string
        default: all
      engines:
        description: 'Comma-separated engines to benchmark, e.g. "duckdb,polars" or "all" (duckdb,polars,arquero,native)'
        type: string
        default: duckdb
      node:
        description: Node.js version
        type: string
        default: "26"
      enforce_budget:
        description: Fail the job when a scale exceeds its time or memory budget
        type: boolean
        default: true
  schedule:
    - cron: "47 4 * * 1"        # Mondays, 04:47 UTC

permissions:
  contents: read

defaults:
  run:
    working-directory: ts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scales: ${{ steps.pick.outputs.scales }}
    steps:
      - id: pick
        working-directory: .
        run: |
          raw='${{ inputs.scales || 'all' }}'
          [ "$raw" = "all" ] && raw="10k,1m,10m"
          echo "scales=$(node -e 'console.log(JSON.stringify(process.argv[1].split(",")))' "$raw")" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.scale }} rows x 20 columns (node)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scale: ${{ fromJSON(needs.plan.outputs.scales) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node || '26' }}
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install and build
        run: |
          node --version
          npm ci
          npm run build

      - name: Runner capacity
        run: |
          echo "cpus: $(nproc)"; free -g | sed -n '1,2p'; df -h / | tail -1

      # Every engine at this scale runs on one runner against one generated pair
      # of files, so the numbers are comparable. An engine that cannot handle the
      # scale is recorded as a failed row rather than failing the job.
      - name: Generate and compare ${{ matrix.scale }} rows
        env:
          ENFORCE: ${{ inputs.enforce_budget }}
          ENGINES: ${{ inputs.engines || 'duckdb' }}
        run: |
          [ "$ENGINES" = "all" ] && ENGINES="duckdb,polars,arquero,native"
          extra=""
          [ "$ENFORCE" = "false" ] && extra="--no-budget"
          rc=0
          for e in $(echo "$ENGINES" | tr ',' ' '); do
            echo "::group::$e at ${{ matrix.scale }} rows"
            node dist/scripts/bench.js \
              --rows ${{ matrix.scale }} \
              --engine "$e" \
              --data-dir data --out-dir bench \
              --threads "$(nproc)" --memory-limit 8GB \
              --keep-data --allow-failure $extra || rc=$?
            echo "::endgroup::"
          done
          rm -rf data
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ts-${{ matrix.scale }}
          path: |
            ts/bench/*.html
            ts/bench/*.json
          retention-days: 30

  summarise:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: bench-ts-*
          merge-multiple: true
      - name: Combined results
        working-directory: .
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readdirSync, readFileSync } from "node:fs";
          const recs = readdirSync("all").filter(f => f.endsWith(".json") && !f.includes("summary"))
            .map(f => JSON.parse(readFileSync("all/" + f, "utf-8")))
            .sort((a, b) => a.rows - b.rows || a.engine.localeCompare(b.engine));
          const f = n => n === null || n === undefined ? "-" : n.toLocaleString("en-US");
          console.log("## Benchmark results (TypeScript)\n");
          console.log("| scale | engine | input | generate | compare | throughput | peak RSS | report |");
          console.log("|---|---|---|---|---|---|---|---|");
          for (const r of recs) {
            const compare = r.failed ? `**${r.failed}** after ${r.wall_before_failure}s` : `**${r.compare_seconds}s**`;
            const per = r.failed ? "-" : `${f(r.rows_per_second)}/s`;
            console.log(`| ${r.scale} | ${r.engine} | ${f(r.input_mb)} MB | ${r.generate_seconds}s ` +
              `| ${compare} | ${per} | ${f(r.peak_rss_mb)}${r.failed ? "" : " MB"} | ${r.failed ? "-" : r.report_mb + " MB"} |`);
          }
          // Fastest engine per scale, and a note on any that could not finish.
          const scales = [...new Set(recs.map(r => r.scale))];
          const winners = scales.map(s => {
            const done = recs.filter(r => r.scale === s && !r.failed);
            if (!done.length) return null;
            const best = done.reduce((x, y) => (y.compare_seconds < x.compare_seconds ? y : x));
            return `**${s}**: ${best.engine} (${best.compare_seconds}s)`;
          }).filter(Boolean);
          if (winners.length) console.log(`\nFastest per scale — ${winners.join(", ")}.`);
          const failed = recs.filter(r => r.failed);
          if (failed.length) console.log(`\nDid not finish: ${failed.map(r => `${r.engine} at ${r.scale} (${r.failed})`).join(", ")}.`);
          if (recs.length) console.log(`\nRunner: ${recs[0].runner}. Reports are attached as artifacts.`);
          JS
