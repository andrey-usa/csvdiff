name: Benchmark (TypeScript)

on:
  workflow_dispatch:
    inputs:
      scales:
        description: 'Comma-separated row counts to run, e.g. "10k,1m,10m" or "20m". "all" means 10k,1m,10m.'
        type: string
        default: all
      engine:
        description: Engine
        type: choice
        default: duckdb
        options: [duckdb, native]
      node:
        description: Node.js version
        type: string
        default: "26"
      enforce_budget:
        description: Fail the job when a scale exceeds its time or memory budget
        type: boolean
        default: true
  schedule:
    - cron: "47 4 * * 1"        # Mondays, 04:47 UTC

permissions:
  contents: read

defaults:
  run:
    working-directory: ts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scales: ${{ steps.pick.outputs.scales }}
    steps:
      - id: pick
        working-directory: .
        run: |
          raw='${{ inputs.scales || 'all' }}'
          [ "$raw" = "all" ] && raw="10k,1m,10m"
          echo "scales=$(node -e 'console.log(JSON.stringify(process.argv[1].split(",")))' "$raw")" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.scale }} rows x 20 columns (node)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scale: ${{ fromJSON(needs.plan.outputs.scales) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node || '26' }}
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install and build
        run: |
          node --version
          npm ci
          npm run build

      - name: Runner capacity
        run: |
          echo "cpus: $(nproc)"; free -g | sed -n '1,2p'; df -h / | tail -1

      - name: Generate and compare ${{ matrix.scale }} rows
        env:
          ENFORCE: ${{ inputs.enforce_budget }}
          ENGINE: ${{ inputs.engine || 'duckdb' }}
        run: |
          extra=""
          [ "$ENFORCE" = "false" ] && extra="--no-budget"
          node dist/scripts/bench.js \
            --rows ${{ matrix.scale }} \
            --engine "$ENGINE" \
            --data-dir data --out-dir bench \
            --threads "$(nproc)" --memory-limit 8GB $extra

      - uses: actions/upload-artifact@v4
        with:
          name: bench-ts-${{ matrix.scale }}-${{ inputs.engine || 'duckdb' }}
          path: |
            ts/bench/*.html
            ts/bench/*.json
          retention-days: 30

  summarise:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: bench-ts-*
          merge-multiple: true
      - name: Combined results
        working-directory: .
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readdirSync, readFileSync } from "node:fs";
          const recs = readdirSync("all").filter(f => f.endsWith(".json") && !f.includes("summary"))
            .map(f => JSON.parse(readFileSync("all/" + f, "utf-8"))).sort((a, b) => a.rows - b.rows);
          const f = n => n.toLocaleString("en-US");
          console.log("## Benchmark results (TypeScript)\n");
          console.log("| scale | engine | input | generate | compare | throughput | peak RSS | report |");
          console.log("|---|---|---|---|---|---|---|---|");
          for (const r of recs) console.log(`| ${r.scale} | ${r.engine} | ${f(r.input_mb)} MB | ${r.generate_seconds}s ` +
            `| **${r.compare_seconds}s** | ${f(r.rows_per_second)}/s | ${f(r.peak_rss_mb)} MB | ${r.report_mb} MB |`);
          if (recs.length) console.log(`\nRunner: ${recs[0].runner}. Reports are attached as artifacts.`);
          JS
