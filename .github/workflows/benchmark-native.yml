name: Benchmark (native)

# The one benchmark this project runs.
#
# It replaces four separate workflows that each measured one language against
# DuckDB. That comparison is settled -- the byte-level ports are between one and
# two orders of magnitude faster, and the numbers are in the archive section of
# README.md -- so what is left worth measuring is the ports against each other,
# on the same host, in one sitting.
#
# On a push it runs the two leaders across all three formats, which is a few
# minutes. `workflow_dispatch` adds Rust and Zig, which need their toolchains
# built and are worth waiting for only when you are asking that question.

# Benchmarks run on a pull request, not on every push to a branch.
#
# Two branches developing engines at once made the push trigger actively
# harmful: a run takes twenty-five minutes, the concurrency group below cancels
# in progress, and every push to a branch under measurement killed the table
# being produced from it. Three joint runs were lost that way in one morning,
# two of them only noticed because somebody re-fetched and compared SHAs by
# hand.
#
# A pull request is a better unit anyway: it is a tree somebody is proposing,
# it does not move while it is being read, and its head is what a reviewer
# would want numbers for. `synchronize` re-runs on a new push to the PR, which
# is the one case where cancelling the previous run is the right thing.
on:
  # No `pull_request` trigger any more. `bench-2m.yml` is the benchmark a pull
  # request gets, and since the C port joined `bench_formats_ports.py` it covers
  # all four ports across all three formats with the scanner builds beside them
  # -- everything this workflow measured on a pull request and more. Two
  # benchmarks on one pull request did not run side by side either: they share
  # the `benchmark-host` group, so the second waited for the first and a
  # reviewer waited for both.
  #
  # What is left here is what `bench-2m.yml` does not do: the run on `main`
  # after a merge, and `alt_ref` on request, which builds another branch's Rust
  # and Zig beside this one's for a side-by-side table.
  push:
    # main only: what landed is worth a number, and nothing is racing it there.
    branches: [main]
    paths:
      - "c/**"
      - "cpp/src/**"
      - "cpp/Makefile"
      - "rust/src/**"
      - "zig/src/**"
      - "scripts/bench_ports.py"
      - ".github/workflows/benchmark-native.yml"
  workflow_dispatch:
    inputs:
      rows:
        description: "Row count (2m, 10m, 20m ...)"
        default: "2m"
      formats:
        description: "Comma-separated: csv, json, parquet"
        default: "csv,json,parquet"
      repeats:
        description: "Interleaved rounds per port"
        default: "5"
      all_ports:
        description: "Add Rust and Zig"
        type: boolean
        default: true
      alt_ref:
        description: >-
          Also build Rust and Zig from this ref and measure them as separate
          columns. Empty for none. Prefer a commit SHA: a branch name resolves
          at checkout time and can move under a run that takes half an hour,
          which happened twice in one morning and mislabelled both tables.
        default: ""

concurrency:
  # One group for every benchmark in the repository, and a queue rather than a
  # cancellation. Taken from what is now bench-2m.yml on the Rust/Zig branch,
  # which had the
  # better answer here: a benchmark that is cancelled has produced nothing, so
  # two runs that overlap should wait for each other instead of one killing the
  # other. Three 10M runs were lost to a cancelling group in one morning.
  group: benchmark-host
  cancel-in-progress: false

jobs:
  bench:
    name: ${{ github.event.inputs.rows || '2m' }} rows, every format
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Rust and Zig, on demand only
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.all_ports == 'true'
        run: echo "ALL_PORTS=1" >> "$GITHUB_ENV"

      # A second checkout, not a merge. Both branches have written a Zig Parquet
      # reader independently, so reconciling them is somebody's afternoon; that
      # is no reason to wait to find out which one is faster. Two trees, one
      # host, one sitting, one set of rows.
      - uses: actions/checkout@v4
        if: env.ALL_PORTS == '1' && github.event.inputs.alt_ref != ''
        with:
          ref: ${{ github.event.inputs.alt_ref }}
          path: alt

      - uses: dtolnay/rust-toolchain@stable
        if: env.ALL_PORTS == '1'
      - uses: Swatinem/rust-cache@v2
        if: env.ALL_PORTS == '1'
        with:
          # `alt/rust` only exists when an alt ref was checked out. Listing it
          # unconditionally makes the cache's cleanup step run `cargo metadata`
          # in a directory that is not there and print an error -- harmless, the
          # run still passes, but an error in a green log is how a real one gets
          # scrolled past. Now that both branches are merged the usual run has
          # no alt ref at all.
          workspaces: |
            rust
            ${{ github.event.inputs.alt_ref != '' && 'alt/rust' || '' }}
      - name: Install Zig
        if: env.ALL_PORTS == '1'
        run: |
          curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      # Ten million rows of ndjson is 8.5 GB, and the runner ships with tens of
      # gigabytes of toolchains this job never opens.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: What this runner is
        run: |
          {
            echo "## Host"
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|L3 cache'
            free -g | head -2
            echo "transparent_hugepage: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Every port compiled for the machine it is about to be measured on.
      #
      # C and C++ have carried `-march=native` in their makefiles since the
      # first table, and Rust and Zig were built for a generic baseline -- so
      # two of the four columns were tuned to the runner and two were not, in
      # favour of the two this project publishes as winners. Worse than a few
      # percent of codegen: the Rust scanner selects itself on
      # `cfg!(target_feature = "avx2")` and the Zig one on the cpu it is given,
      # so a baseline build compiles the wide scanner out of both of them
      # entirely. A lead measured that way is partly a lead in build flags.
      #
      # Each tree keeps its *own* defaults for anything else -- the alt tree's
      # `-Dscan=` width among them, which is that branch's tuning question and
      # not this workflow's to guess at.
      - name: Build
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          # At once rather than in a row; see scripts/build_ports.sh.
          targets="c cpp"
          if [ "${ALL_PORTS:-}" = 1 ]; then
            targets="$targets rust-full zig-native"
          fi
          scripts/build_ports.sh $targets

      # The alt tree's builds are allowed to fail without ending the run: it is
      # another branch's work in progress, and the four ports this workflow is
      # about do not stop being worth measuring because somebody's Zig is
      # mid-refactor. A port that did not build is named in the table's place
      # rather than silently missing -- bench_ports.py prints it as "not built".
      - name: Build the alt ref's Rust and Zig
        if: env.ALL_PORTS == '1' && github.event.inputs.alt_ref != ''
        continue-on-error: true
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          set -x
          make -C alt/cpp || true
          # A ref that still carries the dataframe engines as default features
          # spends twenty minutes building them for a job that runs
          # `--engine turbo` and calls neither. Falls back to a plain build for
          # a ref where the flag does not apply -- this tree, for one.
          cargo build --release --no-default-features --manifest-path alt/rust/Cargo.toml \
              || cargo build --release --manifest-path alt/rust/Cargo.toml || true
          # `-Dcpu=native` first, then without: a ref whose build.zig predates
          # standardTargetOptions would reject the flag, and a missing column is
          # worse than an untuned one.
          (cd alt/zig && zig build --release=fast -Dcpu=native) \
              || (cd alt/zig && zig build --release=fast) || true
          ls -l alt/cpp/build/csvdiff alt/rust/target/release/csvdiff \
                alt/zig/zig-out/bin/csvdiff || true

      - name: Register the alt ports
        if: env.ALL_PORTS == '1' && github.event.inputs.alt_ref != ''
        run: |
          ref="${{ github.event.inputs.alt_ref }}"
          # What was asked for, and what that turned out to be. A branch name
          # resolves at checkout time; twice in one morning it resolved to a
          # commit that was superseded minutes later, and the only reason
          # anybody noticed was a hand re-fetch. The run says it itself now.
          got=$(git -C alt rev-parse HEAD)
          echo "alt ref asked for: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          echo "alt ref resolved to: \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          tag="${ref##*/}"
          python3 - "$tag" <<'PY' >> "$GITHUB_ENV"
          import json, sys
          tag = sys.argv[1]
          spec = [
              [f"C++ ({tag})", "alt/cpp/build/csvdiff", []],
              [f"Rust ({tag})", "alt/rust/target/release/csvdiff",
               ["--engine", "turbo", "-o", "/dev/null"]],
              [f"Zig ({tag})", "alt/zig/zig-out/bin/csvdiff", []],
          ]
          print("CSVDIFF_PORTS_EXTRA=" + json.dumps(spec))
          PY
          echo "measuring the alt ref as well: $ref" >> "$GITHUB_STEP_SUMMARY"

      # Each format is generated, measured and deleted in turn: at ten million
      # rows all three at once would be more than a runner has.
      - name: Generate, measure, delete
        run: |
          set -u
          rows="${{ github.event.inputs.rows || '2m' }}"
          reps="${{ github.event.inputs.repeats || '5' }}"
          formats="${{ github.event.inputs.formats || 'csv,json,parquet' }}"
          data=$(mktemp -d)
          echo "## $rows rows" >> "$GITHUB_STEP_SUMMARY"
          for fmt in ${formats//,/ }; do
            case "$fmt" in
              csv)     ext=.csv;          gen="";; 
              json)    ext=.ndjson;       gen="--format json";;
              parquet) ext=.unc.parquet;  gen="--format parquet";;
              *) echo "::error::unknown format $fmt"; exit 1;;
            esac
            rm -f "$data"/p_*
            c/gen-data --rows "$rows" --out-dir "$data" --prefix p $gen
            {
              echo
              echo "### $fmt"
              echo
              python3 scripts/bench_ports.py \
                  "$data/p_a$ext" "$data/p_b$ext" --repeats "$reps" --tmp "$data"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f "$data"/p_*
          done
