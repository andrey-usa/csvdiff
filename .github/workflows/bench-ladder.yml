name: Benchmark ladder (10M and up)

# A rung per size, all rungs at once, on request only.
#
# This is what `bench-10m.yml` became. Ten million rows on every pull request
# cost 4m48s and held the repository-wide benchmark lock for all of it, and a
# reviewer asking "did this get slower" is answered by `bench-2m.yml` in a
# fraction of that. The large sizes are still the interesting ones -- the index
# stops fitting in cache, the generator stops fitting on the disk -- but they
# are a question somebody asks deliberately, not a tax on every push.
#
# One job per *size and format*, and never one per port: a table's ports have to
# have run on one host in one sitting or it compares machines instead of
# engines. Sizes were never comparable with each other, and neither were
# formats, so splitting on those two costs nothing that was not already gone.
#
# Formats were split off after a 40m run lost everything it had measured. The
# CSV half had finished -- nine builds, real numbers -- and then the runner was
# taken away partway through parquet, with `exit 143` and a shutdown signal. A
# step that publishes at the end cannot help there: when the runner goes, no
# further step runs at all, `if: always()` included, so the upload never
# happened and the numbers survived only in the log. Separate jobs are the only
# arrangement where finishing CSV means keeping CSV.
#
# It costs one generation per cell rather than one per size, and buys back more
# than it costs: each job now generates only its own format, so the 40m CSV job
# writes 14 GB instead of that plus 6 GB of parquet beside it.
#
# `fail-fast: false` is load-bearing. Forty million rows of CSV is about 15 GB
# for the pair and fifty is 18.4 GB, so the top of a ladder can run the runner
# out of disk. When it does, that rung fails and the rungs below it still
# report -- which is most of what you wanted to know anyway, and is why this
# reads as a ladder rather than one number.
#
# **A failed rung does not cancel the larger ones, deliberately.** The obvious
# rule -- 30m failed, so 40m is pointless, stop it -- saves less than it costs.
# The rungs start together, so by the time 30m fails, 40m is already most of the
# way through its own generation and is minutes from its own answer. And a
# cancelled rung reports *nothing*, which throws away the one thing the ladder
# exists to tell you: whether 40m failed for the same reason 30m did, or for a
# different one, or -- when the failure is a runner that happened to have less
# disk -- did not fail at all. Two rungs failing separately is data. One rung
# failing and one cancelled is a guess.
#
# The `collect` job at the bottom is what makes that readable: it prints one
# table of every rung asked for and whether it produced numbers, so where the
# wall is stays obvious without any rung having to be killed to show it.
#
# If you want the ladder to *stop* at the first failure, that is
# `scale-ceiling.yml` -- it climbs deliberately and reports what stopped it. This
# workflow answers "how fast at each of these sizes", which wants every rung it
# was given.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Comma-separated row counts, one job each (10m,20m,40m)"
        default: "10m,20m,40m"
      formats:
        description: "Comma-separated: csv, ndjson, parquet"
        default: "csv,parquet"
      repeats:
        description: "Runs per build; the best is kept"
        default: "2"
      matrix:
        description: "Include the scanner builds (SWAR vs AVX2 vs AVX-512) — triples each job"
        type: boolean
        # Off by default now. Nine builds instead of four is three times the
        # measurements and three times the wall clock for a question about
        # instruction sets, which is not the question a ladder asks. It also
        # produced the highest memory this workflow has recorded -- 15.1 GB on a
        # 16 GB runner, at 40m rows of CSV. Turn it on deliberately.
        default: false
      first:
        description: "Port whose rows run first (label prefix), so a truncated rung keeps its number"
        default: "Rust"

# The same group every benchmark in this repository names, so a ladder and a 2M
# run queue for each other instead of measuring each other's contention. The
# rungs inside one ladder do run together -- that is the point of it -- and each
# one prints its host so a reader can see whether two landed on the same
# machine.
concurrency:
  group: benchmark-host
  cancel-in-progress: false

jobs:
  plan:
    name: read the ladder
    runs-on: ubuntu-latest
    outputs:
      sizes: ${{ steps.read.outputs.sizes }}
      formats: ${{ steps.read.outputs.formats }}
    steps:
      - id: read
        # Refused rather than silently dropped: a size this cannot parse would
        # otherwise become a rung that runs the generator's default and reports
        # a number for the wrong row count, which is this repository's
        # longest-running class of bug.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          rungs = [s.strip() for s in os.environ["SIZES"].split(",") if s.strip()]
          if not rungs:
              sys.exit("no sizes given")
          for s in rungs:
              if not re.fullmatch(r"\d+[kmKM]?", s):
                  sys.exit(f"not a row count: {s!r}")
          print("sizes=" + json.dumps(rungs))
          # Same refusal for formats, and for the same reason: a name this does
          # not know would otherwise become a job that generates nothing and
          # reports an empty table.
          fmts = [f.strip().lower() for f in os.environ["FORMATS"].split(",") if f.strip()]
          if not fmts:
              sys.exit("no formats given")
          for f in fmts:
              if f not in ("csv", "ndjson", "parquet"):
                  sys.exit(f"not a format: {f!r}")
          print("formats=" + json.dumps(fmts))
          PY
        env:
          SIZES: ${{ github.event.inputs.sizes }}
          FORMATS: ${{ github.event.inputs.formats || 'csv,parquet' }}

  rung:
    name: "${{ matrix.size }} rows — ${{ matrix.format }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(needs.plan.outputs.sizes) }}
        format: ${{ fromJSON(needs.plan.outputs.formats) }}
    env:
      FORMAT: ${{ matrix.format }}
      REPEATS: ${{ github.event.inputs.repeats || '2' }}
      MATRIX: ${{ github.event.inputs.matrix || 'false' }}
      FIRST: ${{ github.event.inputs.first || 'Rust' }}
    steps:
      - uses: actions/checkout@v4

      - name: What this runner is
        run: |
          {
            echo "## ${{ matrix.size }} ${{ matrix.format }} — host"
            echo
            echo '```'
            grep -m1 "model name" /proc/cpuinfo
            echo "cores: $(nproc)"
            echo "runner: $RUNNER_NAME"
            free -g | head -2
            df -h --output=avail / | tail -1 | sed 's/^/disk available: /'
            echo -n "vector units: "
            grep -o -m1 -E "avx2|avx512f|avx512bw" /proc/cpuinfo | sort -u | tr '\n' ' '
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ladder-${{ matrix.size }}-${{ matrix.format }}

      - name: Install Zig
        run: |
          pip install ziglang==0.16.0
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version

      # The cleanup is I/O and the builds are CPU, so they run at the same time;
      # nothing needs the disk until the data is generated a step later. See
      # scripts/build_ports.sh.
      - name: Free the disk, and build every port at the same time
        run: |
          before=$(df --output=avail -m / | tail -1)
          (
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          ) >/tmp/freedisk.log 2>&1 &
          freeing=$!

          targets="c rust zig cpp cpp-gen"
          if [ "$MATRIX" = "true" ]; then
            targets="$targets cpp-scanners zig-v32 rust-avx2"
            if grep -q avx512bw /proc/cpuinfo; then
              targets="$targets cpp-avx512 zig-v64"
            else
              echo "no AVX-512 on this runner: the 64-byte builds are skipped"
              rm -f cpp/build/csvdiff-avx512
            fi
          fi

          if CXX=clang++ scripts/build_ports.sh $targets; then built=0; else built=1; fi

          wait "$freeing" || true
          after=$(df --output=avail -m / | tail -1)
          echo "freed $(( (after - before) / 1024 )) GB, $(( after / 1024 )) GB now available"
          exit "$built"

      - name: Run this rung
        run: |
          scanners=""
          if [ "$MATRIX" = "true" ]; then
            scanners="--matrix"
          fi
          python3 scripts/bench_formats_ports.py \
            --rows "${{ matrix.size }}" --formats "$FORMAT" --repeats "$REPEATS" $scanners \
            --first "$FIRST" \
            --md-out /tmp/bench.md \
            | tee /tmp/bench.txt

      # The table outside the code fence and the log inside it. They used to go
      # in together, which meant the markdown table this script prints was
      # sealed in a ``` block and shown as its own source -- a row of pipes,
      # never a table. Everything else the script prints is narrative and does
      # belong in a fence, so the two are published separately rather than the
      # fence being dropped.
      - name: Publish this rung
        if: always()
        run: |
          {
            echo "## ${{ matrix.size }} rows — $FORMAT"
            echo
            if [ -s /tmp/bench.md ]; then
              cat /tmp/bench.md
            else
              echo "_This rung produced no table. Its log is below._"
            fi
            echo
            echo "<details><summary>${{ matrix.size }} ${{ matrix.format }} — full log</summary>"
            echo
            echo '```'
            cat /tmp/bench.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ladder-${{ matrix.size }}-${{ matrix.format }}-${{ github.run_id }}
          # Both: the log for what happened, the table on its own for reading
          # and for pasting into BENCHMARKS.md.
          path: |
            /tmp/bench.txt
            /tmp/bench.md
          retention-days: 30

  collect:
    name: the ladder
    needs: [plan, rung]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Before the download, not after: checkout cleans the workspace, so the
      # other order would delete the rungs it is here to read. This job needs
      # the tree at all because the table it prints comes from
      # scripts/mdtable.py, the same renderer every rung used.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ladder-*-${{ github.run_id }}
          path: rungs
          merge-multiple: false

      - name: One table for the whole ladder
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib, sys
          sizes = json.loads(os.environ["SIZES"])
          formats = json.loads(os.environ["FORMATS"])
          root = pathlib.Path("rungs")
          sys.path.insert(0, "scripts")
          from mdtable import render
          print("## The ladder\n")
          grid, missing = [], []
          for size in sizes:
              row = [size]
              for fmt in formats:
                  # `merge-multiple: false` keeps one directory per cell, named
                  # for the artifact, so a cell that uploaded nothing is visibly
                  # absent rather than merged into a neighbour's file.
                  hit = list(root.glob(f"ladder-{size}-{fmt}-*/bench.txt"))
                  text = hit[0].read_text().strip() if hit else ""
                  row.append("reported" if text else "**none**")
                  if not text:
                      missing.append(f"{size} {fmt}")
              grid.append(row)
          print(render(["Rows"] + formats, ["l"] + ["l"] * len(formats), grid))
          total = len(sizes) * len(formats)
          if missing:
              print(f"{len(missing)} of {total} cells produced no table: "
                    + ", ".join(missing) + ".")
              print("Running out of disk while generating, or the runner itself "
                    "being taken away, are the two usual reasons. Every other "
                    "cell is unaffected -- that is why they are separate jobs.")
          else:
              print(f"All {total} cells reported.")
          PY
        env:
          SIZES: ${{ needs.plan.outputs.sizes }}
          FORMATS: ${{ needs.plan.outputs.formats }}

      - name: Every rung's table, in full
        run: |
          for f in rungs/ladder-*/bench.txt; do
            [ -s "$f" ] || continue
            dir=$(dirname "$f")
            # ladder-<size>-<format>-<run id>
            cell=$(basename "$dir" | sed 's/^ladder-//; s/-[0-9]*$//')
            {
              echo "### ${cell%-*} rows — ${cell##*-}"
              echo
              # The table renders; the log it came from goes in the fold.
              [ -s "$dir/bench.md" ] && { cat "$dir/bench.md"; echo; }
              echo "<details><summary>$cell — full log</summary>"
              echo
              echo '```'
              cat "$f"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
