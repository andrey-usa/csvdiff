name: Benchmark (Java)

on:
  workflow_dispatch:
    inputs:
      scales:
        description: 'Comma-separated row counts to run, e.g. "10k,1m,10m" or "20m". "all" means 10k,1m,10m.'
        type: string
        default: all
      engines:
        description: 'Comma-separated engines, e.g. "duckdb,tablesaw" or "all" (duckdb,tablesaw,native)'
        type: string
        default: duckdb
      java:
        description: Java version
        type: string
        default: "26"
      heap_mb:
        description: 'Child JVM max heap in MB (blank = JVM default, about 1/4 of RAM)'
        type: string
        default: ""
      enforce_budget:
        description: Fail the job when a scale exceeds its time or memory budget
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * 1"        # Mondays, 05:17 UTC

permissions:
  contents: read

defaults:
  run:
    working-directory: java

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scales: ${{ steps.pick.outputs.scales }}
      engines: ${{ steps.pick.outputs.engines }}
    steps:
      - id: pick
        working-directory: .
        run: |
          raw='${{ inputs.scales || 'all' }}'
          [ "$raw" = "all" ] && raw="10k,1m,10m"
          eng='${{ inputs.engines || 'duckdb' }}'
          [ "$eng" = "all" ] && eng="duckdb,tablesaw,native"
          python3 -c "import json,sys; print('scales=' + json.dumps(sys.argv[1].split(',')))" "$raw" >> "$GITHUB_OUTPUT"
          python3 -c "import json,sys; print('engines=' + json.dumps(sys.argv[1].split(',')))" "$eng" >> "$GITHUB_OUTPUT"

  # One job per (scale, engine). An in-heap engine can exhaust memory badly enough
  # to take the runner agent down with it, so each combination is isolated and no
  # other result is lost when one dies. Generation is deterministic, so every job
  # compares byte-identical input.
  bench:
    needs: plan
    name: ${{ matrix.scale }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scale: ${{ fromJSON(needs.plan.outputs.scales) }}
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java || '26' }}
          cache: maven

      - name: Build
        run: |
          java --version
          mvn -B --no-transfer-progress -DskipTests package

      - name: Runner capacity
        run: |
          echo "cpus: $(nproc)"; free -g | sed -n '1,2p'; df -h / | tail -1

      - name: Compare ${{ matrix.scale }} rows with ${{ matrix.engine }}
        env:
          ENFORCE: ${{ inputs.enforce_budget }}
          HEAP_MB: ${{ inputs.heap_mb }}
        run: |
          extra=""
          [ "$ENFORCE" = "false" ] && extra="--no-budget"
          [ -n "$HEAP_MB" ] && extra="$extra --heap-mb $HEAP_MB"
          java -cp target/csvdiff.jar dev.csvdiff.bench.Bench \
            --rows ${{ matrix.scale }} \
            --engine ${{ matrix.engine }} \
            --data-dir data --out-dir bench \
            --threads "$(nproc)" --memory-limit 8GB \
            --allow-failure $extra

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-java-${{ matrix.scale }}-${{ matrix.engine }}
          path: |
            java/bench/*.html
            java/bench/*.json
          retention-days: 30
          if-no-files-found: ignore

  summarise:
    needs: [plan, bench]
    if: always()
    runs-on: ubuntu-latest
    env:
      EXPECTED_SCALES: ${{ needs.plan.outputs.scales }}
      EXPECTED_ENGINES: ${{ needs.plan.outputs.engines }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: bench-java-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Combined results
        # This job never checks the repo out, so the workflow-level java/ default
        # would point at a directory that does not exist here.
        working-directory: .
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readdirSync, readFileSync, existsSync } from "node:fs";
          const recs = (existsSync("all") ? readdirSync("all") : []).filter(f => f.endsWith(".json") && !f.includes("summary"))
            .map(f => JSON.parse(readFileSync("all/" + f, "utf-8")))
            .sort((a, b) => a.rows - b.rows || a.engine.localeCompare(b.engine));
          const f = n => n === null || n === undefined ? "-" : n.toLocaleString("en-US");
          console.log("## Benchmark results (Java)\n");
          console.log("| scale | engine | input | generate | compare | throughput | peak RSS | report |");
          console.log("|---|---|---|---|---|---|---|---|");
          for (const r of recs) {
            const compare = r.failed ? `**${r.failed}** after ${r.wall_before_failure}s` : `**${r.compare_seconds}s**`;
            console.log(`| ${r.scale} | ${r.engine} | ${f(r.input_mb)} MB | ${r.generate_seconds}s ` +
              `| ${compare} | ${r.failed ? "-" : f(r.rows_per_second) + "/s"} | ${f(r.peak_rss_mb)}${r.failed ? "" : " MB"} ` +
              `| ${r.failed ? "-" : r.report_mb + " MB"} |`);
          }
          const scales = [...new Set(recs.map(r => r.scale))];
          const winners = scales.map(s => {
            const done = recs.filter(r => r.scale === s && !r.failed);
            if (!done.length) return null;
            const best = done.reduce((x, y) => (y.compare_seconds < x.compare_seconds ? y : x));
            return `**${s}**: ${best.engine} (${best.compare_seconds}s)`;
          }).filter(Boolean);
          if (winners.length) console.log(`\nFastest per scale — ${winners.join(", ")}.`);
          const failed = recs.filter(r => r.failed);
          if (failed.length) console.log(`\nDid not finish: ${failed.map(r => `${r.engine} at ${r.scale} (${r.failed})`).join(", ")}.`);
          const want = JSON.parse(process.env.EXPECTED_SCALES || "[]")
            .flatMap(s => JSON.parse(process.env.EXPECTED_ENGINES || "[]").map(e => `${s}/${e}`));
          const have = new Set(recs.map(r => `${r.scale}/${r.engine}`));
          const lost = want.filter(k => !have.has(k));
          if (lost.length) console.log(`\nNo result recorded (the runner was lost, i.e. memory exhaustion severe enough to kill the agent): ${lost.join(", ")}.`);
          if (recs.length) console.log(`\nRunner: ${recs[0].runner}. Reports are attached as artifacts.`);
          JS
