name: Conformance

permissions:
  contents: read

# The gate for "four ports, one contract".
#
# parity.yml asks whether the ports agree on one generated dataset. That dataset
# is uniform ASCII by design (it is a benchmark), and the two wrong answers this
# project has shipped both needed an input shape it never contains. This asks
# the same question of inputs built to break byte-level parsers: quoted
# delimiters, doubled quotes, newlines inside quotes, CRLF, ragged rows,
# non-ASCII, duplicate keys, composite keys, and ndjson in several spellings.
#
# It checks two things on every run of every port:
#   * the ports agree with each other on the exit status, `counts` and `columns`;
#   * each --json document conforms to docs/contract.schema.json and to the
#     arithmetic in scripts/contract.py, so a port that is wrong *together* with
#     the reference still fails.
#
# Every port is held to this, none is exempt: a change to any of them that
# breaks it is not mergeable. Make this check required in the repository's
# branch protection for `main`.
#
# A failure prints the seed, the flags and the build. Replay it with
#   scripts/fuzz_diff.py --seeds N-N --ports c,cpp,rust,zig

on:
  push:
    branches: [main]
    paths:
      - "c/**"
      - "cpp/**"
      - "rust/src/**"
      - "rust/Cargo.*"
      - "zig/src/**"
      - "zig/build.zig*"
      - "scripts/fuzz_diff.py"
      - "scripts/contract.py"
      - "scripts/option_matrix.py"
      - "docs/contract.schema.json"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "c/**"
      - "cpp/**"
      - "rust/src/**"
      - "rust/Cargo.*"
      - "zig/src/**"
      - "zig/build.zig*"
      - "scripts/fuzz_diff.py"
      - "scripts/contract.py"
      - "scripts/option_matrix.py"
      - "docs/contract.schema.json"
      - ".github/workflows/conformance.yml"
  schedule:
    # A longer sweep once a week, on the default branch, for the seeds a pull
    # request does not have time for.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds to run, N or LO-HI"
        default: "1-3000"

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: every port, one contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build the native ports
        run: scripts/build_ports.sh c cpp rust zig

      # The options, where the fuzzer keeps them simple: --compare, --ignore and
      # --key together and misspelled, on CSV, ndjson and Parquet. Two ports once
      # compared a column they were told to ignore, and two accepted a misspelled
      # --ignore on Parquet; this is the check that would have said so.
      - name: Every option combination, every format
        run: python3 scripts/option_matrix.py

      # The checker has to be able to fail before its silence means anything.
      - name: The contract checker rejects what it should
        run: python3 scripts/contract.py --self-test

      - name: Fuzz
        shell: bash
        env:
          SEEDS: ${{ github.event_name == 'schedule' && '1-3000' || github.event.inputs.seeds || '1-400' }}
        run: |
          python3 scripts/fuzz_diff.py --seeds "$SEEDS" --ports c,cpp,rust,zig \
            | tee /tmp/fuzz.txt
          {
            echo "## Conformance, seeds $SEEDS"
            echo
            echo '```'
            tail -n 1 /tmp/fuzz.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
