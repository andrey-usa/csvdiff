name: CI (Java)

on:
  push:
    branches: [main]
    paths: ["java/**", ".github/workflows/ci-java.yml", "examples/**"]
  pull_request:
    paths: ["java/**", ".github/workflows/ci-java.yml", "examples/**"]
  workflow_dispatch:

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: java

jobs:
  test:
    name: test java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 is the current release, 25 the current LTS. The bytecode targets 26,
        # so the 25 job builds with 26 and only proves the toolchain is not pinned.
        java: ["26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Versions
        run: java --version && mvn --version

      # -Werror is on in the pom, so any new warning fails here.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Smoke benchmark, 10k rows x 20 columns
        run: java -cp target/csvdiff.jar dev.csvdiff.bench.Bench --rows 10k --engine duckdb --out-dir bench

      # `java -` is not a thing: the launcher rejects it. Source-file mode needs a
      # real path, so every inline program here is written out first.
      - name: Check the report is self-contained
        run: |
          cat > /tmp/CheckReport.java <<'JAVA'
          import java.nio.file.*;
          import java.util.regex.*;
          void main() throws Exception {
            Path path;
            try (var s = Files.list(Path.of("bench"))) {
              path = s.filter(p -> p.getFileName().toString().matches("10k-.*\\.html")).findFirst().orElseThrow();
            }
            String html = Files.readString(path);
            Matcher m = Pattern.compile("(?:src|href)=\"(?!#)([^\"]+)\"").matcher(html);
            if (m.find()) throw new AssertionError("report references external resources: " + m.group(1));
            if (html.length() >= 8_000_000) throw new AssertionError("report unexpectedly large: " + html.length());
            System.out.printf("%s: %d KB, no external references%n", path, html.length() / 1024);
          }
          JAVA
          java /tmp/CheckReport.java

      - uses: actions/upload-artifact@v4
        with:
          name: report-java-10k
          path: |
            java/bench/10k-*.html
            java/bench/10k-*.json
          retention-days: 14

  engines-agree:
    name: all engines produce identical counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - run: mvn -B --no-transfer-progress -DskipTests package
      - run: java -cp target/csvdiff.jar dev.csvdiff.bench.GenData --rows 200k --out-dir data
      - name: Compare with every engine and diff the summaries
        run: |
          for e in duckdb turbo swar shard mmap simd tablesaw native; do
            java --add-modules jdk.incubator.vector \
              -cp target/csvdiff.jar dev.csvdiff.Cli compare data/200k_a.csv data/200k_b.csv \
              -k account_id,txn_id -i updated_at --engine $e \
              -o /tmp/$e.html --json /tmp/$e.json || true
          done
          cat > /tmp/EnginesAgree.java <<'JAVA'
          import com.fasterxml.jackson.databind.*;
          import java.nio.file.*;
          void main() throws Exception {
            var mapper = new ObjectMapper();
            String[] engines = {"duckdb", "turbo", "swar", "shard", "mmap", "simd", "tablesaw", "native"};
            JsonNode ref = null;
            for (String e : engines) {
              JsonNode n = mapper.readTree(Files.readString(Path.of("/tmp/" + e + ".json")));
              if (ref == null) { ref = n; continue; }
              if (!ref.get("counts").equals(n.get("counts")))
                throw new AssertionError(e + " counts differ: " + n.get("counts") + " vs " + ref.get("counts"));
              if (!ref.get("columns").equals(n.get("columns")))
                throw new AssertionError(e + " column stats differ");
            }
            System.out.println("all " + engines.length + " engines agree: " + ref.get("counts"));
          }
          JAVA
          java -cp target/csvdiff.jar /tmp/EnginesAgree.java
