name: CI (Go)

on:
  push:
    branches: [main]
    paths: ["go/**", ".github/workflows/ci-go.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/ci-go.yml"]
  workflow_dispatch:

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: go

jobs:
  test:
    name: test go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24"]
    steps:
      - uses: actions/checkout@v4
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum

      - run: go version

      # gofmt is not advisory in Go; unformatted code is a build-quality failure.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Smoke benchmark, 10k rows x 20 columns
        run: go run ./cmd/bench --rows 10k --engine native --out-dir bench

      - name: Check the report is self-contained
        run: |
          python3 - <<'PY'
          import glob, re, sys
          path = glob.glob("bench/10k-*.html")[0]
          html = open(path, encoding="utf-8").read()
          external = re.search(r'(?:src|href)="(?!#)([^"]+)"', html)
          if external:
              sys.exit(f"report references external resources: {external.group(1)}")
          if len(html) >= 8_000_000:
              sys.exit(f"report unexpectedly large: {len(html)}")
          print(f"{path}: {len(html) // 1024} KB, no external references")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: report-go-10k
          path: |
            go/bench/10k-*.html
            go/bench/10k-*.json
          retention-days: 14

  engines-agree:
    name: all engines produce identical counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so every workflow here runs the same interpreter; the runner's
      # own python3 drifts with the image. Keep this in step with the others:
      #   grep -rn python-version .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum
      - run: go build -o /tmp/csvdiff ./cmd/csvdiff
      - run: go run ./cmd/gen-data --rows 200k --out-dir data
      - name: Compare with every engine and diff the summaries
        run: |
          for e in native; do
            /tmp/csvdiff compare data/200k_a.csv data/200k_b.csv \
              -k account_id,txn_id -i updated_at --engine $e \
              -o /tmp/$e.html --json /tmp/$e.json || true
          done
          python3 - <<'PY'
          import json, sys
          engines = ["native"]
          ref = None
          for e in engines:
              n = json.load(open(f"/tmp/{e}.json"))
              if ref is None:
                  ref, ref_name = n, e
                  continue
              for section in ("counts", "columns"):
                  if n[section] != ref[section]:
                      sys.exit(f"{e} {section} differ from {ref_name}: {n[section]} vs {ref[section]}")
          print(f"all {len(engines)} engines agree:", json.dumps(ref["counts"]))
          PY
