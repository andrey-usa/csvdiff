[package]
name = "csvdiff"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "Parameterised composite-key CSV comparison with a self-contained HTML report"
license = "MIT"

[lib]
name = "csvdiff"
path = "src/lib.rs"

[[bin]]
name = "csvdiff"
path = "src/main.rs"

[[bin]]
name = "gen-data"
path = "src/bin/gen_data.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
# Engine: native, over the csv crate.
csv = "1.4.0"
# Engine: turbo. Maps the file instead of reading it, so the bytes are paged in
# on demand and evictable rather than held on the heap.
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
flate2 = "1.1.10"
base64 = "0.23.1"
# Local time with an offset for the report header; std has no calendar.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
