[package]
name = "csvdiff"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "Parameterised composite-key CSV comparison with a self-contained HTML report"
license = "MIT"

[lib]
name = "csvdiff"
path = "src/lib.rs"

[[bin]]
name = "csvdiff"
path = "src/main.rs"

[[bin]]
name = "gen-data"
path = "src/bin/gen_data.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# The two heavy engines are optional, and on by default: a plain `cargo build`
# is unchanged, and a build that only needs `turbo` can leave them out.
#
# This is not a packaging nicety, it is nineteen minutes. A bundled DuckDB is one
# enormous C++ translation unit and takes nine of them on a hosted runner; the
# polars and arrow chain takes another seven; and linking our own crate against
# both, at `lto = "thin"` and one codegen unit, takes four more. The benchmark
# workflow runs `--engine turbo` exclusively and called none of it.
[features]
default = ["duckdb-engine", "polars-engine"]
duckdb-engine = ["dep:duckdb"]
polars-engine = ["dep:polars"]

[dependencies]
# Engine: DuckDB, out-of-core, the default. Bundled so no system library is needed.
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
# Engine: Polars, the Rust original behind the Node binding benchmarked in ../ts.
polars = { version = "0.55.2", features = ["lazy", "csv", "dtype-full", "is_in", "strings", "abs"], optional = true }
# Engine: native, over the csv crate.
csv = "1.4.0"
# Engine: turbo. Maps the file instead of reading it, so the bytes are paged in
# on demand and evictable rather than held on the heap.
memmap2 = "0.9"
# turbo's Parquet reader decodes its own pages -- snappy and LZ4 are written out
# in the engine, because each is eighty lines of byte copying. These two are not:
# a deflate and a zstd decoder are real programs, and both are already in this
# build behind polars.
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
flate2 = "1.1.10"
base64 = "0.23.1"
# Local time with an offset for the report header; std has no calendar.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Debug info for polars plus a bundled DuckDB runs to tens of gigabytes and buys
# nothing here: a failing test is reproduced from its own output, not a core dump.
[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
